name: Backend CI/CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "IaC/**"
      - ".github/workflows/backend_deploy.yml"

  push:
    branches:
      - main
    paths:
      - "IaC/**"
      - ".github/workflows/backend_deploy.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: IaC
  TF_IN_AUTOMATION: "true"

jobs:
  validate:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r IaC/lambda/requirements_dev.txt

      - name: Run Lambda unit tests
        working-directory: IaC/lambda
        run: pytest -v

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  deploy:
    name: Deploy backend
    needs: validate

    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: cloud-resume-backend-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Initialize Terraform remote state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=cloud-resume/backend/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Create Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -input=false \
            -lock-timeout=5m \
            -out=tfplan

      - name: Apply Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply \
            -input=false \
            -lock-timeout=5m \
            tfplan

      - name: Create deployment summary
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          FUNCTION_URL="$(terraform output -raw lambda_function_url)"

          {
            echo "### Backend deployment completed"
            echo ""
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- AWS Region: ${AWS_REGION}"
            echo "- Lambda Function URL: ${FUNCTION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"